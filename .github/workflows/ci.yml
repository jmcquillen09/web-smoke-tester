name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request or branch replaces the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Windows checks files out with CRLF line endings, which Prettier reports on every file.
      - if: runner.os == 'Linux'
        run: npm run format:check
      - run: npm test

  demo-run:
    name: Demo run (web and API tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e-playwright -- demo-site --browser=chrome,firefox,safari
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The one status a branch rule requires: it passes only when every job above passed.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [checks, demo-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          DEMO_RUN: ${{ needs.demo-run.result }}
        run: |
          echo "checks: $CHECKS, demo-run: $DEMO_RUN"
          test "$CHECKS" = "success" && test "$DEMO_RUN" = "success"
